name: Deploy ProjectHub demo player

on:
  push:
    branches:
      - main
    paths:
      - ProjectHub-demo.mp4
      - docs/**
      - .github/workflows/deploy-demo-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare demo player site
        run: |
          mkdir site
          cp docs/index.html docs/ProjectHub-demo.vtt ProjectHub-demo.mp4 site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
